name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer (torch CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy matplotlib pytest
      - name: Tests (modèles, tâches, figures relues depuis results/)
        env:
          MPLBACKEND: Agg
        run: pytest -q
